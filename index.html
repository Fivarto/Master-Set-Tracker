<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus Master Sets</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101319">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Master Sets">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#15181e;--bg2:#101319;--panel:#1d212a;--panel2:#272c37;--ink:#ebe7df;--mute:#9aa0ac;--line:#2e3440;--acc:#d9ac4e;--accink:#1a1405;--warn:#f08a5d;--serif:Georgia,"Iowan Old Style","Palatino Linotype",serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:38px}
input,select{background:var(--bg2)}
button{cursor:pointer}button:hover{border-color:#4a5262}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,.card:focus-visible,.rc:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.sp{flex:1}
.msg{color:var(--mute);font-size:13px;min-height:18px}.msg.err{color:var(--warn)}
header{display:flex;gap:10px;align-items:center;padding:10px 18px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header img{border-radius:7px;display:block}
h1{font:bold 20px/1 var(--serif);margin:0}
.menuwrap{position:relative}
#menu{position:absolute;right:0;top:calc(100% + 6px);min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.5);display:flex;flex-direction:column}
#menu button{text-align:left;border:0;background:transparent}#menu button:hover{background:var(--panel2)}
main{padding:18px;max-width:1300px;margin:0 auto}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mute);min-height:32px;padding:4px 12px;border-radius:7px}
.seg button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--acc)}
.sum{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:12px 14px;margin-bottom:14px}
#progTxt{font:600 17px/1.3 var(--serif)}
.track{height:8px;background:var(--bg2);border-radius:5px;overflow:hidden;margin-top:8px;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.fill{height:100%;background:linear-gradient(90deg,#b98a2e,var(--acc));width:0;transition:width .4s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
@media(max-width:620px){.grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}main{padding:12px}header{padding:8px 12px}}
.card{position:relative;background:linear-gradient(#262b36,#1d212a);border:1px solid var(--line);border-radius:8px;padding:7px;cursor:pointer;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 6px rgba(0,0,0,.35)}
.card .im{position:relative;aspect-ratio:245/342;border-radius:5px;overflow:hidden;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mute);padding:6px;box-shadow:inset 0 6px 14px rgba(0,0,0,.45)}
.card .im::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.11),transparent 38%);pointer-events:none}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) opacity(.45);transition:filter .35s}
.card.own img{filter:none}
.card.own{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 4px 16px rgba(217,172,78,.2)}
.card.own .im::before{content:"✓";position:absolute;right:6px;bottom:6px;z-index:1;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--accink);font-weight:bold;line-height:22px}
.card b{display:block;font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{display:block;color:var(--mute);font-size:11px;margin-top:2px;line-height:1.25}
.card small.meta{color:var(--acc);font-weight:600}
.card .x{position:absolute;z-index:2;top:10px;right:10px;min-height:0;height:26px;min-width:26px;padding:0 7px;line-height:24px;border-radius:50%;background:rgba(12,14,18,.82);border-color:rgba(255,255,255,.18);opacity:0}
.card:hover .x,.card:focus-within .x{opacity:1}
@media(hover:none){.card .x{opacity:.85}}
.card .x.v{left:10px;right:auto;font-size:13px}
.card .x.h{left:50%;right:auto;transform:translateX(-50%);opacity:.95;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:0 10px}
.card.drag{opacity:.35}
.card.ghost{position:fixed;z-index:60;pointer-events:none;opacity:.92;box-shadow:0 10px 28px rgba(0,0,0,.5);transform:rotate(3deg)}
.card.dropB{box-shadow:-6px 0 0 0 var(--acc)!important}.card.dropA{box-shadow:6px 0 0 0 var(--acc)!important}
.empty{padding:56px 12px;text-align:center;color:var(--mute);font:16px/1.5 var(--serif)}.empty button{margin-top:14px;font-family:system-ui,sans-serif}
.grid .empty{grid-column:1/-1;padding:24px 10px}
#multi{display:flex;flex-direction:column;gap:12px}
.setbox{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;overflow:hidden}
.sethead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px}
.sethead .tog{flex:1;min-width:160px;text-align:left;border:0;background:transparent;font:bold 17px/1.3 var(--serif)}
.sethead .sinfo{color:var(--mute);font-size:13px}
.sethead .track{width:110px;margin:0}
.setbox>.grid{padding:4px 12px 14px}
.chev{display:inline-block;width:1.1em;color:var(--acc)}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px 18px;width:min(740px,94vw);max-height:92vh;box-shadow:0 24px 60px rgba(0,0,0,.6)}
dialog[open]{display:flex;flex-direction:column;gap:12px}
dialog::backdrop{background:rgba(5,6,9,.74)}
@media(max-width:620px){dialog{width:100vw;max-width:100vw;margin:auto 0 0 0;border-radius:16px 16px 0 0;max-height:94vh}}
.dhead{display:flex;align-items:center;gap:10px}
.dhead h2{margin:0;font:bold 19px/1.2 var(--serif);flex:1}
.ic{width:38px;padding:0;font-size:22px;line-height:1;border-radius:50%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:150px}#qn{flex:0 0 130px;min-width:0}
.pane{display:flex;flex-direction:column;gap:10px;min-width:0}
.dfoot{display:flex;gap:8px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;max-height:min(46vh,430px);min-height:120px;overflow:auto;padding:2px}
.rc{position:relative;display:flex;flex-direction:column;gap:3px;font-size:11px;text-align:center;cursor:pointer;border:2px solid transparent;border-radius:10px;padding:4px;background:var(--bg2)}
.rc input{position:absolute;opacity:0;pointer-events:none}
.rimg{display:block;aspect-ratio:245/342;border-radius:6px;overflow:hidden;background:var(--panel2)}
.rimg img{width:100%;height:100%;object-fit:cover;display:block}
.rn{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.rs{color:var(--mute)}
.rc.on{border-color:var(--acc)}
.rc.on::after{content:"✓";position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--accink);font-weight:bold;line-height:22px}
.rc.have{opacity:.5;cursor:default}
.tagin{position:absolute;top:8px;left:8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:10px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form .full{grid-column:1/-1}
.form label,.dform label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.dg{display:grid;grid-template-columns:minmax(0,250px) 1fr;gap:18px}
@media(max-width:620px){.dg{grid-template-columns:1fr}.dimg{max-width:230px;margin:0 auto}}
.dimg .slot{border-radius:10px;overflow:hidden;background:var(--bg2);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.dimg img{width:100%;display:block;cursor:zoom-in}
.dimg button{width:100%;margin-top:8px}
.dform{display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.sw{flex-direction:row;align-items:center;gap:12px;cursor:pointer;padding:10px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;font-size:15px;color:var(--ink)}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;min-height:0;border:0;padding:0;margin:0;border-radius:13px;background:#3b4250;position:relative;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.sw input:checked{background:var(--acc)}.sw input:checked::after{left:21px;background:var(--accink)}
.money{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding-left:12px;color:var(--mute)}
.money input{border:0;background:transparent;flex:1;min-width:0}
details summary{cursor:pointer;color:var(--mute);font-size:13px;margin-bottom:6px}
.hmb{display:none}
@media(max-width:620px){h1,#addBtn{white-space:nowrap}.hd{display:none}.hmb{display:inline}.sethead{gap:8px}.sethead .tog{flex:1 0 140px;min-width:0}.sethead button[data-add]{padding:6px 10px}.sethead .sinfo{order:8}.sethead .track{order:9;flex:1;width:auto;min-width:80px}}
#lb{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center}
#lb img{max-width:100%;max-height:100vh;object-fit:contain}
#lb button{position:absolute;background:rgba(255,255,255,.18);color:#fff;border:0;font-size:28px;width:48px;height:48px;border-radius:50%;padding:0}
#lbX{top:14px;right:14px}#lbPrev{left:14px;top:50%}#lbNext{right:14px;top:50%}
#lbCap{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 4px #000}
</style>
</head>
<body>
<header>
  <img src="icon-192.png" width="30" height="30" alt="">
  <h1>Master Sets</h1>
  <span class="sp"></span>
  <button class="p" id="addBtn"><span class="hd">+ Adicionar cartas</span><span class="hmb">+ Cartas</span></button>
  <div class="menuwrap">
    <button id="menuBtn" class="ic" aria-haspopup="menu" aria-expanded="false" aria-label="Mais opções">⋯</button>
    <div id="menu" role="menu" hidden>
      <button id="newSet">Novo master set</button>
      <button id="delSet">Excluir set atual</button>
      <button id="expBtn">Exportar backup</button>
      <button id="impBtn">Importar backup</button>
    </div>
  </div>
  <input type="file" id="impFile" accept=".json" hidden>
</header>
<main>
  <div class="tools">
    <div class="seg" id="viewSeg" role="group" aria-label="Visualização"><button data-v="one">Set único</button><button data-v="multi">Vários sets</button></div>
    <select id="viewSel" hidden><option value="one"></option><option value="multi"></option></select>
    <select id="setSel" aria-label="Master set"></select>
    <button id="expAll">Expandir</button><button id="colAll">Recolher</button>
  </div>
  <div class="sum"><span id="progTxt"></span><div class="track"><div class="fill" id="fill"></div></div></div>
  <div class="tools">
    <div class="seg" id="filterSeg" role="group" aria-label="Filtro"><button data-f="all">Todas</button><button data-f="miss">Faltando</button><button data-f="own">Já tenho</button></div>
    <select id="filter" hidden><option value="all"></option><option value="miss"></option><option value="own"></option></select>
    <select id="sort" aria-label="Ordenação"><option value="date">Ordem: lançamento</option><option value="az">Ordem: A–Z</option><option value="za">Ordem: Z–A</option><option value="manual">Ordem: manual (arrastar)</option></select>
    <span class="msg" id="hint"></span>
  </div>
  <div id="area"><div class="grid" id="grid"></div><div id="multi"></div></div>
</main>

<dialog id="dlg">
  <div class="dhead"><h2>Adicionar cartas</h2><button class="ic" id="close" aria-label="Fechar">×</button></div>
  <div class="row"><span class="msg">Adicionar ao set:</span><select id="tgt" aria-label="Set de destino"></select></div>
  <div class="seg"><button id="tApi" class="on">Buscar na internet</button><button id="tMan">Cadastrar manualmente</button></div>
  <div id="pApi" class="pane">
    <div class="seg" id="modeSeg"><button data-m="artist" class="on">Ilustrador</button><button data-m="name">Nome da carta</button><button data-m="set">Coleção / nº</button></div>
    <select id="mode" hidden><option value="artist"></option><option value="name"></option><option value="set"></option></select>
    <div class="row"><input id="q" placeholder="Ex.: Mitsuhiro Arita" aria-label="Busca"><input id="qn" placeholder="Nº (opcional)" aria-label="Número da carta" inputmode="text" hidden><button class="p" id="go">Buscar</button></div>
    <div class="msg" id="apiMsg"></div>
    <div class="res" id="res"></div>
    <div class="dfoot"><button id="selAll">Marcar todas</button><button id="more" hidden>Carregar mais</button><span class="sp"></span><button class="p" id="addSel" disabled>Adicionar selecionadas</button></div>
  </div>
  <div id="pMan" class="pane" hidden>
    <div class="form">
      <label class="full">Nome da carta<input id="mName" placeholder="Ex.: Charizard"></label>
      <label>Coleção<input id="mSet" placeholder="Opcional"></label>
      <label>Número<input id="mNum" placeholder="Opcional"></label>
      <label class="full">URL da imagem<input id="mImg" placeholder="https://... (opcional)"></label>
    </div>
    <div class="msg">Sem URL, o app tenta achar a imagem pelo nome e número.</div>
    <div class="dfoot"><span class="sp"></span><button class="p" id="mAdd">Adicionar carta</button></div>
  </div>
</dialog>

<dialog id="det">
  <div class="dhead"><h2 id="dName"></h2><button class="ic" id="dClose" aria-label="Fechar">×</button></div>
  <div class="msg" id="dSub"></div>
  <div class="dg">
    <div class="dimg"><div class="slot"><img id="dImg" alt=""></div><button id="dFull">⤢ Tela cheia</button></div>
    <div class="dform">
      <label class="sw"><input type="checkbox" id="dOwn"><span>Já tenho esta carta</span></label>
      <div class="two"><label>Condição<select id="dCond"></select></label><label>Versão<select id="dVer"></select></label></div>
      <label>Preço pago<div class="money"><span>R$</span><input id="dPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0,00"></div></label>
      <details><summary>Imagem da carta</summary><label>URL da imagem<input id="dUrl" placeholder="https://..."></label></details>
      <div class="msg">As alterações são salvas automaticamente.</div>
    </div>
  </div>
</dialog>
<div id="lb" hidden>
  <button id="lbPrev" aria-label="Anterior">‹</button><img id="lbImg" alt=""><button id="lbNext" aria-label="Próxima">›</button>
  <button id="lbX" aria-label="Fechar">×</button><div id="lbCap"></div>
</div>
<script>
const KEY='pokemon-master-sets-v1';
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.sets)S={sets:[],cur:null};
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Não foi possível salvar no navegador.')}};
const cur=()=>S.sets.find(s=>s.id===S.cur);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function cardHtml(c,canDrag){
  return `<div class="card ${c.owned?'own':''}" tabindex="0" role="button" aria-pressed="${!!c.owned}" data-id="${c.id}">
    ${canDrag?`<button class="x h" data-h aria-label="Arrastar para reordenar" title="Arraste para reordenar">⠿</button>`:''}<button class="x v" data-open="${c.id}" aria-label="Detalhes e tela cheia" title="Detalhes">⤢</button><button class="x" data-del="${c.id}" aria-label="Remover carta" title="Remover">×</button>
    <div class="im">${c.img?`<img loading="lazy" src="${esc(c.img)}" alt="${esc(c.name)}" onerror="this.parentNode.textContent='Sem imagem'">`:'Sem imagem'}</div>
    <b>${esc(c.name)}</b><small>${esc(c.set||'')} ${c.num?'#'+esc(c.num):''}</small>${c.owned?`<small class="meta">${esc([c.cond&&c.cond.replace(/.*\((.*)\)/,'$1'),c.ver,c.price>0&&money(c.price)].filter(Boolean).join(' · '))}</small>`:''}</div>`;
}
function stats(cards){
  const own=cards.filter(c=>c.owned).length,tot=cards.length;
  return {own,tot,pct:tot?own/tot*100:0,spent:cards.reduce((a,c)=>a+(c.owned&&c.price>0?c.price:0),0)};
}
function findCard(id){for(const s of S.sets){const c=s.cards.find(x=>x.id===id);if(c)return {s,c}}return null}
function render(){
  const multi=S.view==='multi';syncSeg();
  $('viewSel').value=multi?'multi':'one';
  $('setSel').hidden=multi;$('delSet').hidden=multi;$('expAll').hidden=!multi;$('colAll').hidden=!multi;
  $('setSel').innerHTML=S.sets.map(s=>`<option value="${s.id}" ${s.id===S.cur?'selected':''}>${esc(s.name)}</option>`).join('')||'<option>Nenhum set</option>';
  const g=$('grid'),m=$('multi');g.hidden=multi;m.hidden=!multi;
  const f=$('filter').value,canDrag=$('sort').value==='manual'&&f==='all';
  $('hint').textContent=$('sort').value==='manual'?(canDrag?'Arraste pelo botão ⠿ para reordenar.':'Para reordenar, use o filtro "Todas".'):'';
  if(!S.sets.length){(multi?m:g).innerHTML='<div class="empty">Seu fichário está vazio.<br>Crie um master set, por exemplo com o nome de um ilustrador.<br><button class="p" data-newset>Criar master set</button></div>';$('progTxt').textContent='';$('fill').style.width='0';return}
  if(multi){
    const t=stats(S.sets.flatMap(x=>x.cards));
    $('progTxt').textContent=`${t.own} de ${t.tot} cartas em ${S.sets.length} sets (${Math.round(t.pct)}%)`+(t.spent?` · Investido: ${money(t.spent)}`:'');
    $('fill').style.width=t.pct+'%';
    m.innerHTML=S.sets.map(x=>{
      const st=stats(x.cards),open=!!x.open,list=open?visible(x):[];
      return `<section class="setbox" data-sid="${x.id}"><div class="sethead">
        <button class="tog" data-tog="${x.id}" aria-expanded="${open}"><span class="chev">${open?'▾':'▸'}</span>${esc(x.name)}</button>
        <span class="sinfo">${st.own}/${st.tot} (${Math.round(st.pct)}%)${st.spent?' · '+money(st.spent):''}</span>
        <div class="track"><div class="fill" style="width:${st.pct}%"></div></div>
        <button data-add="${x.id}">+ Cartas</button><button data-dels="${x.id}" aria-label="Excluir set" title="Excluir set">×</button></div>
        <div class="grid" ${open?'':'hidden'}>${open?(list.length?list.map(c=>cardHtml(c,canDrag)).join(''):`<div class="empty">${st.tot?'Nenhuma carta neste filtro.':'Nenhuma carta ainda. Clique em “+ Cartas”.'}</div>`):''}</div></section>`;
    }).join('');
    return;
  }
  const x=cur(),st=stats(x.cards),list=visible(x);
  $('progTxt').textContent=`${st.own} de ${st.tot} cartas (${Math.round(st.pct)}%)`+(st.spent?` · Investido: ${money(st.spent)}`:'');
  $('fill').style.width=st.pct+'%';
  g.innerHTML=list.length?list.map(c=>cardHtml(c,canDrag)).join(''):`<div class="empty">${st.tot?'Nenhuma carta neste filtro.':'Nenhuma carta ainda. Clique em “Adicionar cartas”.'}</div>`;
}

$('area').addEventListener('click',e=>{
  if(e.target.closest('[data-h]'))return;
  if(e.target.closest('[data-newset]')){$('newSet').click();return}
  const tg=e.target.closest('[data-tog]');
  if(tg){const x=S.sets.find(y=>y.id===tg.dataset.tog);x.open=!x.open;S.cur=x.id;save();render();return}
  const ad=e.target.closest('[data-add]');
  if(ad){S.cur=ad.dataset.add;save();render();openAdd();return}
  const ds=e.target.closest('[data-dels]');
  if(ds){const x=S.sets.find(y=>y.id===ds.dataset.dels);if(confirm(`Excluir o set "${x.name}" e todas as suas cartas?`)){S.sets=S.sets.filter(y=>y!==x);if(S.cur===x.id)S.cur=S.sets[0]?S.sets[0].id:null;save();render()}return}
  const o=e.target.closest('[data-open]');if(o){openDet(o.dataset.open);return}
  const d=e.target.closest('[data-del]');

  const el=e.target.closest('.card');if(!el)return;
  const r=findCard(el.dataset.id);if(r){r.c.owned=!r.c.owned;save();render()}
});

const dlg=$('dlg');
let results=[],picked=new Set(),page=1,lastQ='';
function openAdd(){
  if(!cur()){alert('Crie um master set primeiro.');return}
  $('tgt').innerHTML=S.sets.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('tgt').value=S.cur;

function tab(api){$('pApi').hidden=!api;$('pMan').hidden=api;$('tApi').classList.toggle('on',api);$('tMan').classList.toggle('on',!api)}
$('tApi').onclick=()=>tab(true);$('tMan').onclick=()=>tab(false);
$('mode').onchange=()=>{const m=$('mode').value;$('qn').hidden=m!=='set';$('q').placeholder=m==='artist'?'Ex.: Mitsuhiro Arita':m==='name'?'Ex.: Pikachu':'Coleção (nome ou código). Ex.: Base Set, sv3pt5'};
function candidates(){
  const m=$('mode').value,v=$('q').value.trim();
  if(!v)return [];
  if(m==='artist')return [`artist:"${v}"`];
  if(m==='name')return [`name:"${v}"`];
  const n=$('qn').value.trim().split('/')[0].trim(),dig=/^\d+$/.test(n);
  const nums=n?[...new Set([n,dig&&n.padStart(3,'0'),dig&&String(parseInt(n,10))].filter(Boolean))]:[''];
  const words=v.split(/\s+/).map(w=>w.replace(/[^\p{L}\p{N}]/gu,'')).filter(Boolean);
  const sets=[];
  if(words.length===1)sets.push(`set.id:"${words[0].toLowerCase()}"`,`set.ptcgoCode:"${words[0].toUpperCase()}"`);
  if(words.length)sets.push(words.map(w=>`set.name:${w}*`).join(' '));
  const out=[];
  sets.forEach(sq=>nums.forEach(nn=>out.push(nn?`${sq} number:"${nn}"`:sq)));
  return out;
}
async function fetchPage(q,pg){
  const r=await fetch(`https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(q)}&pageSize=100&page=${pg}&orderBy=set.releaseDate&select=id,name,number,images,set,artist`);
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function similar(x,y){
  const a=norm(x),b=norm(y);if(!a||!b)return false;
  const tol=Math.max(2,Math.round(b.length*.15)),r=b.split(' ').reverse().join(' ');
  return a===b||lev(a,b)<=tol||lev(a,r)<=tol;
}
function fuzzyQ(v){
  const w=norm(v).split(' ').filter(x=>x.length>1);
  if(!w.length)return '';
  const p=x=>`artist:${x.slice(0,3)}*`;
  return w.length>1?`${p(w[0])} ${p(w[w.length-1])}`:p(w[0]);
}
let lastArtist='',loaded=0,total=0;
async function search(more){
  const m=$('apiMsg');m.className='msg';
  const mode=$('mode').value;
  let cs=[];
  if(!more){
    cs=candidates();
    if(!cs.length){m.textContent=mode==='set'?'Informe a coleção (nome ou código).':'Digite algo para buscar.';return}
    results=[];picked=new Set();page=1;lastQ='';loaded=0;total=0;lastArtist=$('q').value.trim();sid++;
  }else page++;
  m.textContent='Buscando…';
  try{
    let data=[],tot=0,exactN=0,err=null,found=false;
    if(more){const t=await fetchPage(lastQ,page);data=t.data;tot=t.totalCount;exactN=data.length;found=true}
    else if(mode==='artist'){
      // busca exata + busca aproximada (pega grafias diferentes do nome na base de dados)
      const fq=fuzzyQ(lastArtist);
      const rs=await Promise.allSettled([fetchPage(cs[0],1),fq?fetchPage(fq,1):Promise.resolve({data:[],totalCount:0})]);
      if(rs[0].status==='fulfilled'){data=rs[0].value.data;tot=rs[0].value.totalCount;exactN=data.length;lastQ=cs[0]}else err=rs[0].reason;
      if(rs[1].status==='fulfilled')data=data.concat(rs[1].value.data.filter(c=>similar(c.artist,lastArtist)));
      found=data.length>0;
    }else for(const q of cs){
      try{const t=await fetchPage(q,1);if(t.totalCount>0){data=t.data;tot=t.totalCount;exactN=data.length;lastQ=q;found=true;break}}catch(e){err=e}
    }
    if(!found){
      if(err)throw err;
      $('res').innerHTML='';$('more').hidden=true;updateSel();
      if(mode==='artist'&&!more){m.textContent='Nenhuma carta na base principal.';enrich(lastArtist,sid);return}
      m.textContent=mode==='set'?'Nenhuma carta encontrada. Tente o código da coleção (ex.: MEP, SVP, sv3pt5) ou só parte do nome. Coleções muito recentes podem ainda não estar na base de dados.':'Nenhuma carta encontrada.';
      return;
    }
    loaded+=exactN;if(!more||tot)total=tot;
    const seen=new Set(results.map(c=>c.key));
    data.forEach(c=>{if(seen.has(c.id))return;seen.add(c.id);results.push({key:c.id,name:c.name,set:c.set.name,num:c.number,img:c.images.small,big:c.images.large,date:c.set.releaseDate,alt:mode==='artist'?(norm(c.artist)!==norm(lastArtist)?c.artist:''):(c.artist||'')})});
    results.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||String(a.num).localeCompare(String(b.num),undefined,{numeric:true}));
    const alts=mode==='artist'?results.filter(c=>c.alt).length:0;
    m.textContent=`${results.length} cartas encontradas.`+(loaded<total?' Use “Carregar mais” para ver o resto.':'')+(alts?` ${alts} com o nome do ilustrador escrito de forma diferente na base (marcadas nas cartas).`:'')+' Clique nas cartas para selecionar.';
    $('more').hidden=loaded>=total;
    drawRes();
    if(mode==='artist'&&!more)enrich(lastArtist,sid);
  }catch(e){m.className='msg err';m.textContent='Falha na busca ('+e.message+'). Verifique a internet e tente de novo; a API às vezes demora.'}
}
let sid=0;
const sig=c=>norm(c.name)+'|'+(parseInt(c.num,10)||norm(c.num));
function inSet(c){return cur().cards.some(x=>x.key===c.key||sig(x)===sig(c))}
const dexSets={};
async function dexJson(u){const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function enrich(name,id){
  const m=$('apiMsg'),base=' Consultando a segunda base (TCGdex)…';
  m.textContent+=base;
  try{
    const j=await dexJson(`https://api.tcgdex.net/v2/en/illustrators/${encodeURIComponent(name)}`);
    const list=Array.isArray(j)?j:(j.cards||[]);
    if(id!==sid)return;
    const known=new Set(results.map(sig));
    const todo=list.filter(b=>b.id&&!known.has(norm(b.name)+'|'+(parseInt(b.localId,10)||norm(b.localId))));
    const add=[];
    for(let i=0;i<todo.length;i+=6){
      const part=await Promise.all(todo.slice(i,i+6).map(async b=>{
        try{
          const d=await dexJson(`https://api.tcgdex.net/v2/en/cards/${encodeURIComponent(b.id)}`);
          const si=d.set&&d.set.id;
          if(si&&!dexSets[si])dexSets[si]=dexJson(`https://api.tcgdex.net/v2/en/sets/${encodeURIComponent(si)}`).then(x=>x.releaseDate||'',()=>'');
          const dt=si?await dexSets[si]:'';
          return {key:'dex:'+d.id,name:d.name,set:d.set?d.set.name:'',num:d.localId,img:d.image?d.image+'/low.webp':'',big:d.image?d.image+'/high.webp':'',date:dt?dt.replace(/-/g,'/'):'9999',alt:'',src:'TCGdex'};
        }catch(e){return null}
      }));
      add.push(...part.filter(Boolean));
    }
    if(id!==sid)return;
    let n=0;
    add.forEach(c=>{if(!results.some(r=>sig(r)===sig(c))){results.push(c);n++}});
    results.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||String(a.num).localeCompare(String(b.num),undefined,{numeric:true}));
    m.textContent=m.textContent.replace(base,n?` ${n} carta(s) vieram da segunda base (TCGdex), marcadas nas cartas.`:' A segunda base (TCGdex) não trouxe cartas novas.');
    drawRes();
  }catch(e){if(id===sid)m.textContent=m.textContent.replace(base,' Não consegui consultar a segunda base (TCGdex).')}
}
function updateSel(){const n=picked.size;$('addSel').disabled=!n;$('addSel').textContent=n?`Adicionar (${n})`:'Adicionar selecionadas'}
function drawRes(){
  $('res').innerHTML=results.map(c=>{const h=inSet(c),on=picked.has(c.key);
    return `<label class="rc ${on?'on':''} ${h?'have':''}" title="${esc(c.name)}"><input type="checkbox" data-k="${c.key}" ${on?'checked':''} ${h?'disabled':''}><span class="rimg"><img loading="lazy" src="${esc(c.img)}" alt="${esc(c.name)}"></span><span class="rn">${esc(c.name)}</span><span class="rs">${esc(c.set)} #${esc(c.num)}</span>${c.alt?`<span class="rs">Ilustr.: ${esc(c.alt)}</span>`:''}${c.src?`<span class="rs">Fonte: ${c.src}</span>`:''}${h?'<span class="tagin">No set</span>':''}</label>`}).join('');
  updateSel();
}
$('res').addEventListener('change',e=>{const k=e.target.dataset.k;e.target.checked?picked.add(k):picked.delete(k);e.target.parentNode.classList.toggle('on',e.target.checked);updateSel()});
$('go').onclick=()=>search(false);
$('q').onkeydown=$('qn').onkeydown=e=>{if(e.key==='Enter')search(false)};
$('more').onclick=()=>search(true);
$('selAll').onclick=()=>{const ks=results.filter(c=>!inSet(c)).map(c=>c.key),all=ks.length&&ks.every(k=>picked.has(k));picked=new Set(all?[]:ks);drawRes()};
$('addSel').onclick=()=>{
  const s=cur();let n=0;
  results.filter(c=>picked.has(c.key)&&!inSet(c)).forEach(c=>{s.cards.push({id:uid(),key:c.key,name:c.name,set:c.set,num:c.num,img:c.img,big:c.big,date:c.date,owned:false});n++});
  save();render();picked=new Set();drawRes();$('apiMsg').textContent=`${n} carta(s) adicionada(s).`;
};

/* Manual */
$('mAdd').onclick=async()=>{

/* Detalhes e tela cheia */
const CONDS=['','Mint (M)','Near Mint (NM)','Lightly Played (LP)','Moderately Played (MP)','Heavily Played (HP)','Danificada (DMG)','Gradada (PSA/BGS/CGC)'];
const VERS=['','Normal','Holo','Reverse Holo','Full Art','Alternate Art','Promo','Primeira edição','Outra'];
$('dCond').innerHTML=CONDS.map(v=>`<option value="${v}">${v||'Não informada'}</option>`).join('');
$('dVer').innerHTML=VERS.map(v=>`<option value="${v}">${v||'Não informada'}</option>`).join('');
const money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const big=c=>c.big||(c.img&&/images\.pokemontcg\.io/.test(c.img)?c.img.replace(/\.png$/,'_hires.png'):c.img);
function visible(s){
  const f=$('filter').value,o=$('sort').value;s=s||cur();
  if(!s)return [];
  const l=s.cards.filter(c=>f==='all'||(f==='own')===!!c.owned);
  const tie=(a,b)=>(a.date||'').localeCompare(b.date||'')||String(a.num).localeCompare(String(b.num),undefined,{numeric:true});
  const nm=(a,b)=>a.name.localeCompare(b.name,'pt-BR',{sensitivity:'base'})||tie(a,b);
  const dt=(a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||String(a.num).localeCompare(String(b.num),undefined,{numeric:true});
  if(o==='date')l.sort(dt);else if(o==='az')l.sort(nm);else if(o==='za')l.sort((a,b)=>nm(b,a));
  return l;
}
let dId=null,lbBack=false,lbList=[],lbI=0;
const dCard=()=>{const r=findCard(dId);return r&&r.c};
function openDet(id){
  dId=id;const c=dCard();
  $('dName').textContent=c.name;$('dSub').textContent=`${c.set||''} ${c.num?'#'+c.num:''}`;
  $('dImg').src=c.img||'';$('dOwn').checked=!!c.owned;
  $('dCond').value=c.cond||'';$('dVer').value=c.ver||'';
  $('dPrice').value=c.price>0?c.price:'';$('dUrl').value=c.img||'';
  $('det').showModal();
}
function upd(){
  const c=dCard();if(!c)return;
  c.owned=$('dOwn').checked;c.cond=$('dCond').value;c.ver=$('dVer').value;
  c.price=$('dPrice').value===''?'':parseFloat($('dPrice').value);
  const u=$('dUrl').value.trim();
  if(u!==(c.img||'')){c.img=u;c.big='';$('dImg').src=u}
  save();render();
}
['dOwn','dCond','dVer','dPrice','dUrl'].forEach(i=>$(i).addEventListener('change',upd));
$('dClose').onclick=()=>$('det').close();
function showLb(){
  const c=lbList[lbI],im=$('lbImg');
  im.onerror=()=>{im.onerror=null;im.src=c.img};
  im.src=big(c);
  $('lbCap').textContent=`${c.name} · ${c.set||''} ${c.num?'#'+c.num:''} · ${c.owned?'Na coleção':'Faltando'} (${lbI+1}/${lbList.length})`;
}
function openLb(id,fromDet){
  const r=findCard(id);lbList=r?visible(r.s):[];lbI=Math.max(0,lbList.findIndex(c=>c.id===id));
  lbBack=!!fromDet;if(fromDet)$('det').close();
  $('lb').hidden=false;showLb();
  if($('lb').requestFullscreen)$('lb').requestFullscreen().catch(()=>{});
}
function closeLb(){
  $('lb').hidden=true;
  if(document.fullscreenElement)document.exitFullscreen();
  if(lbBack){lbBack=false;$('det').showModal()}
}
function stepLb(d){if(!lbList.length)return;lbI=(lbI+d+lbList.length)%lbList.length;showLb()}
$('dFull').onclick=()=>openLb(dId,true);
$('dImg').onclick=()=>openLb(dId,true);
$('lbX').onclick=closeLb;$('lbPrev').onclick=()=>stepLb(-1);$('lbNext').onclick=()=>stepLb(1);
$('lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLb()});
document.addEventListener('keydown',e=>{
  if($('lb').hidden)return;
  if(e.key==='Escape')closeLb();
  if(e.key==='ArrowLeft')stepLb(-1);
  if(e.key==='ArrowRight')stepLb(1);
});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&!$('lb').hidden)closeLb()});

/* Arrastar e soltar (mouse e toque) */
let drag=null;
function moveGhost(e){drag.g.style.left=(e.clientX-drag.w/2)+'px';drag.g.style.top=(e.clientY-40)+'px';drag.y=e.clientY}
function clearMarks(){document.querySelectorAll('.dropA,.dropB').forEach(x=>x.classList.remove('dropA','dropB'))}
$('area').addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-h]');if(!h||drag)return;
  e.preventDefault();
  const card=h.closest('.card'),g=card.cloneNode(true);
  g.className=card.className+' ghost';g.style.width=card.offsetWidth+'px';
  document.body.appendChild(g);card.classList.add('drag');
  drag={id:card.dataset.id,g,card,t:null,after:false,y:e.clientY,w:card.offsetWidth};
  moveGhost(e);
  drag.timer=setInterval(()=>{if(drag.y<70)scrollBy(0,-14);else if(drag.y>innerHeight-70)scrollBy(0,14)},16);
});
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  moveGhost(e);clearMarks();
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const t=el&&el.closest('.card:not(.ghost)');
  if(t&&t!==drag.card&&t.closest('.setbox')===drag.card.closest('.setbox')){const r=t.getBoundingClientRect();drag.after=e.clientX>r.left+r.width/2;drag.t=t;t.classList.add(drag.after?'dropA':'dropB')}
  else drag.t=null;
});
function endDrag(ok){
  if(!drag)return;
  clearInterval(drag.timer);drag.g.remove();clearMarks();
  if(ok&&drag.t){
    const arr=findCard(drag.id).s.cards,i=arr.findIndex(c=>c.id===drag.id),m=arr.splice(i,1)[0];
    let j=arr.findIndex(c=>c.id===drag.t.dataset.id);if(drag.after)j++;
    arr.splice(j,0,m);save();
  }
  drag=null;render();
}
window.addEventListener('pointerup',()=>endDrag(true));
window.addEventListener('pointercancel',()=>endDrag(false));
